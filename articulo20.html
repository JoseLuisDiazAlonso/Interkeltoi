               data-es="EL VERMÚ DE LAS 6 NACIONES – INTERKELTOI 2026 
🇫🇷 ¡Desde las costas de la Bretaña francesa hasta las tierras de Numancia!
Dicen que los bretones llevan siglos resistiendo invasiones, conservando sus tradiciones y celebrando la vida alrededor de una buena mesa. ¡Y en Garray sabemos bastante de las tres cosas! ⚔️
En esta ocasión, La Penúltima Bar & Restaurante será nuestro pequeño rincón bretón, donde los sabores de la tierra se encuentran con la gastronomía de inspiración celta.
CANAPÉ DE CONFIT DE PATO Una deliciosa combinación de confit de pato, reducción de naranja y suave parmentier. Una propuesta para conquistar paladares sin necesidad de levantar una espada.
 Domingo, 1 de noviembre  Desde las 12:30 h Música tradicional celta desde las 13:10 h
Porque puede que los romanos conquistaran la Galia… ¡pero hubo una pequeña aldea que nunca dejó de resistir! 
 ¡Que suenen las gaitas, que corra el vermú y que viva la Bretaña!
 INTERKELTOI 2026 Seis naciones. Un mismo espíritu"
               
               data-en="THE SIX NATIONS VERMOUTH – INTERKELTOI 2026 

🇫🇷 From the shores of French Brittany to the lands of Numancia!

They say the Bretons have spent centuries resisting invasions, preserving their traditions and celebrating life around a good table. And here in Garray, we know a thing or two about all three! ⚔️

This time, La Penúltima Bar & Restaurante will become our very own little corner of Brittany, where local flavours meet Celtic-inspired cuisine.

 DUCK CONFIT CANAPÉ

A delicious combination of duck confit, orange reduction and smooth parmentier potato purée. A dish designed to conquer your taste buds without having to raise a sword.

Sunday, 1 November
 From 12:30 pm
Traditional Celtic music from 1:10 pm

Because the Romans may have conquered Gaul… but there was one little village that never stopped resisting! 

 Let the bagpipes play, let the vermouth flow and long live Brittany!

INTERKELTOI 2026
Six nations. One spirit.">
