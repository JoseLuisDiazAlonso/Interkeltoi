            <p class="texto-articulo4 traducible" style="font-size: 1.3em; font-weight: bold; line-height: 1.6; color: #8B4513;"
               data-es="LAS HISTORIAS DE NUMANCIA ESTÁN A PUNTO DE VOLVER A CONTARSE...
               Detrás de cada historia hay una voz capaz de hacerla eterna. Hoy nos colamos en el estudio de grabación 
               con Elena Fadrique, que está poniendo voz a los relatos que nos acompañarán en Interkeltoi-Samain.
               Su misión será muy especial: contar a los más pequeños la memoria de Numancia, acercándoles nuestro pasado a
               través de historias, personajes y recuerdos que siguen vivos después de más de dos mil años.
               Por que la historia no solo está escrita en los libros. También vive en las voces que la transmiten, en quienes
               la escuchan y en las nuevas generaciones que la hacen suya.
               Este Samain, Numancia volverá a hablar. Y los niños tendrán mucho que descubrir."
               
               data-en="THE STORIES OF NUMANTIA ARE ABOUT TO BE TOLD ONCE AGAIN...
               Behind every story there is a voice capable of making it eternal. Today we sneak into the recording studio
               with Elena Fadrique, who is lending her voice to the tales that will accompany us at Interkeltoi-Samain.
               Her mission will be a very special one: to tell the youngest ones the memory of Numantia, bringing our past closer to them
               through stories, characters and memories that are still alive after more than two thousand years.
               Because history is not only written in books. It also lives in the voices that pass it on, in those who
               listen to it, and in the new generations who make it their own.
               This Samain, Numantia will speak again. And the children will have plenty to discover.">
