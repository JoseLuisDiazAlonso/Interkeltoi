               data-es="EL VERMÚ DE LAS 6 NACIONES – INTERKELTOI 2026 

🇮🇪 Irlanda llega al Bar Numancia, y lo hace con una receta que sabe a tradición, a tierra y a buena mesa.

Un clásico de la cocina irlandesa, donde el puré de patata y la col se unen con unas deliciosas y crujientes joyas de nuestra tierra soriana.
Porque en Interkeltoi las culturas no solo se encuentran a través de la música y las tradiciones… ¡también lo hacen alrededor de una mesa!
Domingo, 1 de noviembre  Desde las 12:30 h  Música tradicional irlandesa desde las 14:00 h para acompañar este pequeño viaje gastronómico sin salir de Garray.

Seis naciones y una misma forma de celebrar: ¡con buena comida, música y amigos!

INTERKELTOI 2026 Seis naciones. Un mismo espíritu."
               
               data-en="THE SIX NATIONS VERMOUTH – INTERKELTOI 2026 

🇮🇪 Ireland is coming to Bar Numancia, bringing a recipe full of tradition, local flavours and good food.

A classic of Irish cuisine, where mashed potatoes and cabbage come together with some delicious, crispy gems from our very own Soria region.

Because at Interkeltoi, cultures don't just come together through music and traditions… they also meet around the table!

Sunday, 1 November
From 12:30 pm
Traditional Irish music from 2:00 pm, accompanying this little gastronomic journey without ever leaving Garray.

Six nations, one shared way of celebrating: with great food, music and friends!

INTERKELTOI 2026
Six nations. One spirit.">
