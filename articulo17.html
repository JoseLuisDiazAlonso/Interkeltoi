            <p class="texto-articulo4 traducible" style="font-size: 1.3em; font-weight: bold; line-height: 1.6; color: #8B4513;"
               data-es="CUANDO EL DIOS LUGH DESPIERTA, EL CUERPO SE CONVIERTE EN LEYENDA
               Hay danzas que no solo se bailan....se sienten, se viven y se transmiten generación en generación.
               
               En el Samain de Interkeltoi, Raquel Pérez, socia de la Asociación Cultural Celtibérica Tierra Quemada, será la encargada de dar vida a la 
               Danza de Lugh, una coreografía creada para conectar el movimiento, la naturaleza y la fuerza de nuestros antiguos pueblos.
               
               Cada gesto, cada paso y cada movimiento nos acercará a un tiempo en el que la danza era mucho más que arte: era celebración, identidad y
               conexión con lo sagrado.
               
               El fuego será testigo.
               La tierra marcará el ritmo.
               Y la danza hará volver la memoria de los antiguos"
               
               data-en="WHEN THE GOD LUGH AWAKENS, THE BODY BECOMES LEGEND.

Some dances are not just danced… they are felt, lived and passed down from generation to generation.

At Interkeltoi's Samhain, Raquel Pérez, a member of the Tierra Quemada Celtiberian Cultural Association, will bring to life the Dance of Lugh, a choreography created to connect movement, nature and the strength of our ancient peoples. 🌑🔥

Every gesture, every step and every movement will take us back to a time when dance was much more than art: it was celebration, identity and a connection with the sacred.

 The fire will bear witness.
 The earth will set the rhythm.
 And the dance will bring back the memory of the ancients.">
